[package]
name = "rayo"
version = "0.2.0"
edition = "2024"
description = "A fast, minimalist file explorer for Windows, with instant search built in"
license = "MIT"
repository = "https://github.com/ElRobaMichis/rayo"
homepage = "https://github.com/ElRobaMichis/rayo"
readme = "README.md"
keywords = ["file-manager", "explorer", "windows", "search", "egui"]
categories = ["filesystem", "gui"]

[lib]
name = "rayo"
path = "src/lib.rs"

[[bin]]
name = "rayo"
path = "src/main.rs"

[[bin]]
name = "rayo-bench"
path = "src/bin/bench.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = { version = "0.36.2", default-features = false }
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
memchr = "2.7"
aho-corasick = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1.10"
parking_lot = "0.12"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
winit = { version = "0.30.13", default-features = false }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_RestartManager",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Foundation",
]

[patch.crates-io]
# Copia de winit 0.30.13 con una sola función agregada (`prepare_keyboard_layout`)
# para preparar la tabla del teclado en paralelo y mostrar la ventana ~70 ms antes.
winit = { path = "vendor/winit" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
