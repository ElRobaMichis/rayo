name: Bug report
description: Something doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! The more precise the steps, the faster it gets fixed. English or Spanish are both fine.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder with…
        2. Right-click…
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rayo version
      description: Shown in Installed apps, or the release you downloaded.
      placeholder: "0.1.0"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: Crash log
      description: If Rayo closed by itself, paste the end of `%LOCALAPPDATA%\Rayo\errores.log`.
      render: text
